{% extends 'base.html' %}

{% block title %} FEED page {% endblock %}

{% block content %}
	<div>
        <h2 class="h2 p-2">FEED page here</h2>
        {% for post in posts %}
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="card-title">{{ post.title }}</h5>
                    <p class="card-text">{{ post.content }}</p>
                    <p class="card-text"><small class="text-muted">Posted by {{ post.author.username }} on {{ post.created_at }}</small></p>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
