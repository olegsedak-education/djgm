name: Django CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          djangogramm/manage.py test web.tests

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "Starting deployment..."
            # TODO: Navigate to your project directory on the server
            # Example: cd /var/www/myproject
            #
            # TODO: Pull the latest changes
            # Example: git pull origin main
            #
            # TODO: Activate virtual environment (if you use one)
            # Example: source /path/to/your/venv/bin/activate
            #
            # TODO: Install/update dependencies (if needed, already done in runner but might be needed on server venv)
            # Example: pip install -r requirements.txt
            #
            # TODO: Run Django migrations
            # Example: python djangogramm/manage.py migrate --settings=djangogramm.settings.web.prod
            #
            # TODO: Collect static files
            # Example: python djangogramm/manage.py collectstatic --noinput --settings=djangogramm.settings.web.prod
            #
            # TODO: Restart your application server (e.g., Gunicorn, uWSGI)
            # Example: sudo systemctl restart your-django-app.service
            #
            # If you use the install_prod.sh script, ensure it's executable and handles the above steps:
            # Example: sh ./install_prod.sh
            #
            echo "Deployment finished."